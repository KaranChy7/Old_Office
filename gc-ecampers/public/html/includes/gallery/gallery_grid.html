<!-- Lightbox -->
<div id="lightbox" style="position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.92); display:none; align-items:center; justify-content:center; padding:2rem; backdrop-filter:blur(8px);" onclick="closeLightbox()">
  <button onclick="closeLightbox()" style="position:absolute; top:1.5rem; right:1.5rem; width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,0.2); background:none; color:#fff; font-size:1.4rem; cursor:pointer; display:flex; align-items:center; justify-content:center;">
    <i class="ri-close-line"></i>
  </button>
  <img id="lightboxImg" src="" alt="" style="max-width:90vw; max-height:85vh; border-radius:8px; box-shadow:0 40px 100px rgba(0,0,0,0.8); object-fit:contain;" onclick="event.stopPropagation()">
  <p id="lightboxCaption" style="position:absolute; bottom:2rem; left:50%; transform:translateX(-50%); font-size:0.8rem; color:rgba(255,255,255,0.5); letter-spacing:0.05em; white-space:nowrap;"></p>
</div>

<style>
.gallery-item:hover .gallery-hover { opacity: 1 !important; }
.gallery-item:hover img { transform: scale(1.04); }
.gallery-filter-btn.is-active {
  background: linear-gradient(135deg, #e2bf72, #c9a84c, #a8893a) !important;
  color: #0a0a0a !important;
  border-color: transparent !important;
}
</style>

<script>
function openLightbox(src, alt) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxImg').alt = alt;
  document.getElementById('lightboxCaption').textContent = alt;
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

// Filter functionality
document.querySelectorAll('.gallery-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.gallery-filter-btn').forEach(b => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    const filter = btn.dataset.filter;
    document.querySelectorAll('.gallery-item').forEach(item => {
      const show = filter === 'all' || item.dataset.category === filter;
      item.style.display = show ? 'block' : 'none';
    });
  });
});
</script>
